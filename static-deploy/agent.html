<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CRESTORA — AI Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #151717;
      --em: #6b7c8a;
      --soft: rgba(255,255,255,.72);
      --line: rgba(21,23,23,.12);
      --ease: cubic-bezier(.16,1,.3,1);
      --font: "Instrument Sans", system-ui, sans-serif;
      --serif: Lora, Georgia, serif;
      --sky: linear-gradient(180deg, #7eb6e4 0%, #b7d7f2 38%, #e8f3fb 72%, #f5faff 100%);
      --card: rgba(255,255,255,.78);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      min-height: 100%;
      min-height: 100svh;
      font-family: var(--font);
      color: var(--ink);
      background: var(--sky);
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { background: none; border: 0; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .hidden { display: none !important; }

    .page {
      position: relative;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .page::before {
      content: "";
      position: absolute; inset: 0;
      background:
        radial-gradient(60% 40% at 50% 0%, rgba(255,255,255,.55), transparent 70%),
        radial-gradient(40% 30% at 80% 20%, rgba(142,188,230,.35), transparent 60%);
      pointer-events: none;
    }

    .topbar {
      position: sticky; top: 0; z-index: 30;
      border-bottom: 1px solid rgba(21,23,23,.08);
      background: rgba(232,243,251,.78);
      backdrop-filter: blur(14px);
    }
    .topbar-inner {
      max-width: 48rem;
      margin: 0 auto;
      padding: 0.95rem max(1.1rem, env(safe-area-inset-right)) 0.95rem max(1.1rem, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .top-left {
      display: flex; align-items: center; gap: 0.9rem; min-width: 0;
    }
    .home-link {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(21,23,23,.55);
      white-space: nowrap;
    }
    .home-link:hover { color: var(--ink); }
    .sep { width: 1px; height: 1rem; background: rgba(21,23,23,.18); }
    .brand-link {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.03em;
    }
    .btn-reset {
      border: 1px solid rgba(21,23,23,.2);
      border-radius: 999px;
      padding: 0.55rem 1rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(255,255,255,.55);
      transition: background .25s ease, border-color .25s ease;
    }
    .btn-reset:hover { background: #fff; border-color: rgba(21,23,23,.35); }
    .btn-reset:disabled { opacity: .4; }

    .main {
      position: relative; z-index: 10;
      width: min(48rem, 100%);
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1.5rem max(1.1rem, env(safe-area-inset-right)) calc(7.8rem + env(safe-area-inset-bottom)) max(1.1rem, env(safe-area-inset-left));
    }

    /* ——— Empty / welcome ——— */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      animation: rise .75s var(--ease) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: none; }
    }
    .welcome-head {
      text-align: center;
      max-width: 28rem;
      margin: 0 auto 1.75rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      padding: 0.95rem 1.5rem;
      border-radius: 1rem;
      border: 1px solid rgba(21,23,23,.14);
      background: rgba(255,255,255,.7);
      box-shadow: 0 16px 40px rgba(21,23,23,.08);
      backdrop-filter: blur(10px);
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.18em;
    }
    .eyebrow {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(21,23,23,.5);
      margin-bottom: 0.85rem;
    }
    .welcome-head h1 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(2.35rem, 8vw, 3.6rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }
    .welcome-head h1 em {
      font-style: italic;
      color: rgba(21,23,23,.55);
    }
    .rule {
      width: 3.5rem;
      height: 1px;
      margin: 1.1rem auto;
      background: rgba(21,23,23,.28);
    }
    .lede {
      font-size: 0.98rem;
      line-height: 1.55;
      color: rgba(21,23,23,.62);
      font-weight: 500;
    }
    .help-label {
      margin-top: 1.6rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(21,23,23,.48);
    }

    .topics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    @media (min-width: 720px) {
      .topics { grid-template-columns: repeat(4, 1fr); gap: 0.9rem; }
    }
    .topic {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.75rem;
      text-align: left;
      padding: 1rem;
      border-radius: 1rem;
      border: 1px solid rgba(21,23,23,.1);
      background: var(--card);
      box-shadow: 0 10px 28px rgba(21,23,23,.06);
      backdrop-filter: blur(8px);
      transition: transform .3s var(--ease), border-color .25s ease, box-shadow .3s ease;
    }
    @media (min-width: 720px) { .topic { padding: 1.15rem; } }
    .topic:hover {
      transform: translateY(-3px);
      border-color: rgba(21,23,23,.22);
      box-shadow: 0 16px 36px rgba(21,23,23,.1);
    }
    .topic:disabled { opacity: .45; pointer-events: none; }
    .topic-icon {
      width: 2.4rem; height: 2.4rem;
      border-radius: 999px;
      border: 1px solid rgba(21,23,23,.14);
      background: rgba(255,255,255,.7);
      display: grid; place-items: center;
      color: var(--ink);
    }
    .topic-icon svg { width: 1rem; height: 1rem; }
    .topic span {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }
    .topic.wa .topic-icon {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    /* ——— Chat ——— */
    .thread {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      padding-top: 0.4rem;
    }
    .bubble {
      max-width: min(88%, 34rem);
      padding: 0.85rem 1.05rem;
      font-size: 0.95rem;
      line-height: 1.5;
      font-weight: 500;
      letter-spacing: -0.01em;
      white-space: pre-wrap;
      word-break: break-word;
      animation: rise .4s var(--ease) both;
    }
    .row { display: flex; }
    .row.user { justify-content: flex-end; }
    .row.agent { justify-content: flex-start; }
    .bubble.user {
      background: var(--ink);
      color: #fff;
      border-radius: 999px;
      border-bottom-right-radius: 14px;
      padding: 0.8rem 1.15rem;
    }
    .bubble.agent {
      background: #fff;
      color: var(--ink);
      border-radius: 1.1rem;
      border-bottom-left-radius: 0.35rem;
      box-shadow: 0 10px 28px rgba(21,23,23,.08);
    }
    .bubble.agent.error { color: #7a2424; background: #fff5f5; }
    .typing {
      display: inline-flex; align-items: center; gap: 5px;
      background: #fff;
      border-radius: 999px;
      padding: 0.9rem 1.15rem;
      box-shadow: 0 10px 28px rgba(21,23,23,.08);
    }
    .typing i {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(21,23,23,.35);
      animation: bounce 1.1s ease-in-out infinite;
    }
    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .35; }
      40% { transform: translateY(-4px); opacity: 1; }
    }
    .btn-retry {
      margin-top: 0.55rem;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(21,23,23,.55);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .btn-retry:hover { color: var(--ink); }

    /* ——— Composer ——— */
    .composer {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      border-top: 1px solid rgba(21,23,23,.08);
      background: rgba(245,250,255,.88);
      backdrop-filter: blur(14px);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .composer-inner {
      max-width: 48rem;
      margin: 0 auto;
      padding: 0.9rem max(1.1rem, env(safe-area-inset-right)) 0.95rem max(1.1rem, env(safe-area-inset-left));
      display: flex;
      align-items: flex-end;
      gap: 0.7rem;
    }
    .composer textarea {
      flex: 1;
      min-height: 3rem;
      max-height: 8rem;
      resize: none;
      border: 1px solid rgba(21,23,23,.14);
      background: rgba(255,255,255,.9);
      border-radius: 1.1rem;
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      outline: 0;
      box-shadow: 0 6px 18px rgba(21,23,23,.04);
    }
    .composer textarea:focus { border-color: rgba(21,23,23,.3); }
    .composer textarea:disabled { opacity: .6; }
    .send {
      flex-shrink: 0;
      border-radius: 0.85rem;
      background: rgba(21, 23, 23, 0.22);
      color: rgba(255, 255, 255, 0.75);
      padding: 0.9rem 1.15rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: background .2s ease, color .2s ease, transform .2s var(--ease);
    }
    .send.is-ready {
      background: var(--ink);
      color: #fff;
    }
    .send.is-ready:hover { transform: translateY(-1px); }
    .send:disabled { cursor: default; transform: none; }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="top-left">
          <a class="home-link" href="/">← Home</a>
          <span class="sep" aria-hidden="true"></span>
          <a class="brand-link" href="/">CRESTORA</a>
        </div>
        <button type="button" class="btn-reset" id="startOver">Start over</button>
      </div>
    </header>

    <main class="main">
      <section class="welcome" id="welcome">
        <div class="welcome-head">
          <div class="badge">CRESTORA</div>
          <p class="eyebrow">Personal property help</p>
          <h1>Live where <em>ambition settles.</em></h1>
          <div class="rule" aria-hidden="true"></div>
          <p class="lede">Ask about buying, selling, leasing, budgets, or booking a tour with our Chennai team.</p>
          <p class="help-label">What can we help with?</p>
        </div>
        <div class="topics" id="topics"></div>
      </section>

      <section class="thread hidden" id="thread" aria-live="polite"></section>
    </main>

    <form class="composer" id="form">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="Ask us anything about your next home..." enterkeyhint="send"></textarea>
        <button class="send" type="submit" id="sendBtn">Send</button>
      </div>
    </form>
  </div>

  <script>
    (function () {
      const WA = "https://wa.me/918190007072";
      const welcome = document.getElementById("welcome");
      const thread = document.getElementById("thread");
      const topicsEl = document.getElementById("topics");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("sendBtn");
      const startOver = document.getElementById("startOver");

      let history = [];
      let loading = false;
      let lastFailed = null;

      const icon = {
        home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-10.5Z"/></svg>',
        tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.6 13.05 11 22.6a2 2 0 0 1-2.8 0L1.4 15.8a2 2 0 0 1 0-2.8L11 3.4a2 2 0 0 1 1.4-.6H20a1 1 0 0 1 1 1v7.6a2 2 0 0 1-.4 1.25Z"/><circle cx="16.5" cy="7.5" r="1.2"/></svg>',
        key: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="15" r="4"/><path d="M11.5 12.5 21 3m-4 0 4 4-2 2"/></svg>',
        wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6H19a1 1 0 0 1 1 1v11a2 2 0 0 1-2 2H5.5A2.5 2.5 0 0 1 3 17.5v-9Z"/><path d="M3 9h16v3h-3.2a1.8 1.8 0 0 0 0 3.6H20"/></svg>',
        calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
        users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="3"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a3 3 0 0 1 0 5.74"/></svg>',
        map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m8 4-5 2v14l5-2 8 2 5-2V4l-5 2-8-2Z"/><path d="M8 4v14M16 6v14"/></svg>',
        chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg>',
      };

      const TOPICS = [
        { label: "Buy a home", ask: "Buy a home", svg: icon.home },
        { label: "Sell my home", ask: "Sell my home", svg: icon.tag },
        { label: "Lease", ask: "Lease", svg: icon.key },
        { label: "Budget guidance", ask: "Budget guidance", svg: icon.wallet },
        { label: "Book a tour", ask: "Book a tour", svg: icon.calendar },
        { label: "Join as an advisor", ask: "Join as an advisor", svg: icon.users },
        { label: "Neighborhood fit", ask: "Neighborhood fit in Chennai", svg: icon.map },
        { label: "Talk on WhatsApp", type: "wa", href: WA, svg: icon.chat },
      ];

      function setBusy(on) {
        loading = on;
        sendBtn.disabled = on || !input.value.trim();
        startOver.disabled = on;
        topicsEl.querySelectorAll("button").forEach((b) => (b.disabled = on));
      }

      function showChat() {
        welcome.classList.add("hidden");
        thread.classList.remove("hidden");
      }

      function showWelcome() {
        welcome.classList.remove("hidden");
        thread.classList.add("hidden");
        thread.innerHTML = "";
      }

      function scrollBottom() {
        window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
      }

      function addRow(who) {
        const row = document.createElement("div");
        row.className = "row " + who;
        thread.appendChild(row);
        return row;
      }

      function addUser(text) {
        showChat();
        const row = addRow("user");
        const el = document.createElement("div");
        el.className = "bubble user";
        el.textContent = text;
        row.appendChild(el);
        scrollBottom();
      }

      function addTyping() {
        const row = addRow("agent");
        const el = document.createElement("div");
        el.className = "typing";
        el.innerHTML = "<i></i><i></i><i></i>";
        row.appendChild(el);
        scrollBottom();
        return row;
      }

      function addAgentShell() {
        const row = addRow("agent");
        const el = document.createElement("div");
        el.className = "bubble agent";
        row.appendChild(el);
        scrollBottom();
        return { row, el };
      }

      function sleep(ms) {
        return new Promise((r) => setTimeout(r, ms));
      }

      async function streamWordByWord(el, reader) {
        const decoder = new TextDecoder();
        let buffer = "";
        let pending = "";
        let produced = false;

        const flush = async (force) => {
          const parts = pending.split(/(\s+)/);
          if (!force && parts.length < 2) return;
          const complete = force ? parts : parts.slice(0, -1);
          pending = force ? "" : parts[parts.length - 1];
          for (const chunk of complete) {
            el.textContent += chunk;
            scrollBottom();
            if (chunk.trim()) await sleep(26);
          }
        };

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const frames = buffer.split("\n\n");
          buffer = frames.pop() || "";
          for (const frame of frames) {
            const line = frame
              .split("\n")
              .map((l) => l.trim())
              .find((l) => l.startsWith("data: "));
            if (!line) continue;
            const payload = JSON.parse(line.slice(6));
            if (payload.error) throw new Error(payload.error);
            if (payload.text) {
              produced = true;
              pending += payload.text;
              await flush(false);
            }
          }
        }
        await flush(true);
        return produced;
      }

      async function ask(text, opts) {
        const q = (text || "").trim();
        if (!q || loading) return;

        lastFailed = null;
        if (!opts || !opts.retry) {
          addUser(q);
          history.push({ role: "user", text: q });
        } else {
          const err = thread.querySelector(".bubble.agent.error");
          if (err) err.closest(".row")?.remove();
        }

        setBusy(true);
        const typingRow = addTyping();

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: q, history: history.slice(0, -1) }),
          });
          const contentType = res.headers.get("content-type") || "";
          if (!res.ok || !contentType.includes("text/event-stream")) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.error || "Request failed");
          }
          if (!res.body) throw new Error("Request failed");

          typingRow.remove();
          const { el } = addAgentShell();
          const produced = await streamWordByWord(el, res.body.getReader());
          const finalText = (el.textContent || "").trim();
          if (!produced || !finalText) throw new Error("Empty reply");
          history.push({ role: "model", text: finalText });
        } catch (err) {
          typingRow.remove();
          lastFailed = q;
          const { el, row } = addAgentShell();
          el.classList.add("error");
          el.textContent = (err && err.message) || "Something went wrong. Please try again.";
          const retry = document.createElement("button");
          retry.type = "button";
          retry.className = "btn-retry";
          retry.textContent = "Retry";
          retry.addEventListener("click", () => ask(q, { retry: true }));
          el.appendChild(document.createElement("br"));
          el.appendChild(retry);
          row.appendChild(el);
        } finally {
          setBusy(false);
          syncSend();
          input.focus();
        }
      }

      function resetChat() {
        history = [];
        lastFailed = null;
        setBusy(false);
        showWelcome();
        input.value = "";
        syncSend();
        input.focus();
      }

      function syncSend() {
        const ready = !loading && !!input.value.trim();
        sendBtn.disabled = !ready;
        sendBtn.classList.toggle("is-ready", ready);
      }

      TOPICS.forEach((t, i) => {
        if (t.type === "wa") {
          const a = document.createElement("a");
          a.className = "topic wa";
          a.href = t.href;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.style.animationDelay = 0.08 + i * 0.04 + "s";
          a.innerHTML =
            '<span class="topic-icon">' +
            t.svg +
            "</span><span>" +
            t.label +
            "</span>";
          topicsEl.appendChild(a);
          return;
        }
        const b = document.createElement("button");
        b.type = "button";
        b.className = "topic";
        b.style.animationDelay = 0.08 + i * 0.04 + "s";
        b.innerHTML =
          '<span class="topic-icon">' + t.svg + "</span><span>" + t.label + "</span>";
        b.addEventListener("click", () => ask(t.ask));
        topicsEl.appendChild(b);
      });

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const q = input.value.trim();
        if (!q) return;
        input.value = "";
        syncSend();
        ask(q);
      });

      input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 128) + "px";
        syncSend();
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });

      startOver.addEventListener("click", resetChat);
      syncSend();
      input.focus();
    })();
  </script>
</body>
</html>
